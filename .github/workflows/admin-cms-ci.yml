name: Admin CMS CI

on:
  push:
    branches: [feature/admin-cms]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-cms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --maxWorkers=2 --minWorkers=1

      - name: Operational tests
        run: npm run test:ops

      - name: Production build
        run: npm run build


      - name: Package standalone server
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi
          tar -czf admin-cms-standalone.tar.gz -C .next/standalone .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-cms-standalone
          path: admin-cms-standalone.tar.gz
          if-no-files-found: error
          retention-days: 7

      # CI-only: no deployment, server credentials, or production database access.
